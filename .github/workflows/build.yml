name: Build and Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check available Xcode versions
      run: |
        echo "Available Xcode versions:"
        ls /Applications/ | grep -i xcode
        echo "Current Xcode path:"
        xcode-select -p
        echo "Xcode version:"
        xcodebuild -version
    
    - name: List available schemes
      run: xcodebuild -project DropdownTerminal.xcodeproj -list
      
    - name: Build for Release (Simple Build)
      run: |
        xcodebuild -project DropdownTerminal.xcodeproj \
                   -target DropdownTerminal \
                   -configuration Release \
                   -derivedDataPath ./build \
                   DEVELOPMENT_TEAM="" \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=NO \
                   build
    
    - name: Locate built app
      run: |
        find ./build -name "*.app" -type d
        mkdir -p ./build/Release
        cp -R ./build/Build/Products/Release/DropdownTerminal.app ./build/Release/
    
    - name: Create DMG
      run: |
        mkdir -p dmg
        cp -R ./build/Release/DropdownTerminal.app dmg/
        hdiutil create -volname "DropdownTerminal" -srcfolder dmg -ov -format UDZO DropdownTerminal.dmg
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DropdownTerminal-${{ github.sha }}
        path: |
          DropdownTerminal.dmg
          ./build/Release/DropdownTerminal.app
    
    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./DropdownTerminal.dmg
        asset_name: DropdownTerminal.dmg
        asset_content_type: application/octet-stream