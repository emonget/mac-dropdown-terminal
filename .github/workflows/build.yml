name: Build and Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check available Xcode versions
      run: |
        echo "Available Xcode versions:"
        ls /Applications/ | grep -i xcode
        echo "Current Xcode path:"
        xcode-select -p
        echo "Xcode version:"
        xcodebuild -version
    
    - name: List available schemes
      run: xcodebuild -project DropdownTerminal.xcodeproj -list
      
    - name: Build for Release (Apple Silicon)
      run: |
        xcodebuild -project DropdownTerminal.xcodeproj \
                   -target DropdownTerminal \
                   -configuration Release \
                   -arch arm64 \
                   DEVELOPMENT_TEAM="" \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=NO \
                   CONFIGURATION_BUILD_DIR="./build/Release" \
                   GIT_COMMIT="${{ github.sha }}" \
                   BUILD_DATE="$(date -u)" \
                   build
    
    - name: Verify built app
      run: |
        ls -la ./build/Release/
        if [ -d "./build/Release/DropdownTerminal.app" ]; then
          echo "✅ App built successfully"
          ls -la "./build/Release/DropdownTerminal.app/Contents/"
        else
          echo "❌ App not found"
          find . -name "*.app" -type d
          exit 1
        fi
    
    - name: Add build info to app
      run: |
        echo "Commit: ${{ github.sha }}" > ./build/Release/DropdownTerminal.app/Contents/Resources/build-info.txt
        echo "Built: $(date -u)" >> ./build/Release/DropdownTerminal.app/Contents/Resources/build-info.txt
        echo "Branch: dev" >> ./build/Release/DropdownTerminal.app/Contents/Resources/build-info.txt
        echo "Run: ${{ github.run_number }}" >> ./build/Release/DropdownTerminal.app/Contents/Resources/build-info.txt
        
    - name: Create DMG
      run: |
        mkdir -p dmg
        cp -R ./build/Release/DropdownTerminal.app dmg/
        hdiutil create -volname "DropdownTerminal" -srcfolder dmg -ov -format UDZO DropdownTerminal.dmg
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DropdownTerminal-${{ github.sha }}
        path: |
          DropdownTerminal.dmg
          build/Release/DropdownTerminal.app
    
    - name: Create Dev Release
      if: github.ref == 'refs/heads/dev'
      uses: ncipollo/release-action@v1
      with:
        tag: dev-build
        name: "Development Build"
        body: |
          🚧 **Latest Development Build**
          
          Commit: ${{ github.sha }}
          Branch: dev
          Updated: ${{ github.event.head_commit.timestamp }}
          
          **One-line install:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/emonget/mac-dropdown-terminal/dev/install.sh | sh
          ```
          
          **Manual install:**
          Download the DMG below and drag to Applications folder.
        artifacts: "DropdownTerminal.dmg"
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}