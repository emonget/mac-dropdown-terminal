name: Build and Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check available Xcode versions
      run: |
        echo "Available Xcode versions:"
        ls /Applications/ | grep -i xcode
        echo "Current Xcode path:"
        xcode-select -p
        echo "Xcode version:"
        xcodebuild -version
    
    - name: List available schemes
      run: xcodebuild -project DropdownTerminal.xcodeproj -list
      
    - name: Build for Release (Apple Silicon)
      run: |
        xcodebuild -project DropdownTerminal.xcodeproj \
                   -target DropdownTerminal \
                   -configuration Release \
                   -arch arm64 \
                   DEVELOPMENT_TEAM="" \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=NO \
                   CONFIGURATION_BUILD_DIR="./build/Release" \
                   build
    
    - name: Verify built app
      run: |
        ls -la ./build/Release/
        if [ -d "./build/Release/DropdownTerminal.app" ]; then
          echo "✅ App built successfully"
          ls -la "./build/Release/DropdownTerminal.app/Contents/"
        else
          echo "❌ App not found"
          find . -name "*.app" -type d
          exit 1
        fi
    
    - name: Create DMG
      run: |
        mkdir -p dmg
        cp -R ./build/Release/DropdownTerminal.app dmg/
        hdiutil create -volname "DropdownTerminal" -srcfolder dmg -ov -format UDZO DropdownTerminal.dmg
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DropdownTerminal-${{ github.sha }}
        path: |
          DropdownTerminal.dmg
          build/Release/DropdownTerminal.app
    
    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./DropdownTerminal.dmg
        asset_name: DropdownTerminal.dmg
        asset_content_type: application/octet-stream